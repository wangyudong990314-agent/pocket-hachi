<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#dceafe"><meta name="description" content="住在手机里的小八，摸摸、喂食、一起玩。"><title>大芝咸咸的小八</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='10' fill='%23295caa'/%3E%3Ctext x='4' y='25' font-size='24'%3E🐾%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head>
<body><main><header><span class="brand">🐾 大芝咸咸的小八</span><span class="pill">今天也陪着你</span></header><section class="room" aria-label="小八的房间"><div class="intro"><span class="eyebrow">你的专属小伙伴</span><h1>嗨，我是小八。</h1><p>没什么大事，只想和你待一会儿。</p></div><div class="window" aria-hidden="true"><span>☁</span></div><div class="floor"></div><div class="rug"></div><div id="bubble" class="bubble" role="status" aria-live="polite">来摸摸我的脑袋吧～</div><button id="pet" class="pet" aria-label="摸摸小八，按方向键或拖动可移动"><img src="hachiware.png" alt="蓝白配色、粉色脸颊的小八" draggable="false"></button><div id="hearts" aria-hidden="true"></div><div class="tip">轻点摸摸 · 拖动挪窝</div></section><section class="controls" aria-label="照顾小八"><div class="status-row"><div><span class="eyebrow">小八现在</span><h2 id="mood">心情很不错</h2></div><span id="stateIcon" class="state-icon">♡</span></div><div class="actions"><button data-action="feed"><span>🐟</span>喂点好吃的</button><button data-action="play"><span>🧶</span>一起玩</button><button data-action="sleep"><span>🌙</span><span id="sleepLabel">睡个小觉</span></button></div><p class="footnote">留一小会儿，给自己充充电。</p></section></main><script src="app.js"></script></body></html>
